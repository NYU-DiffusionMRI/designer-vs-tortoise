[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dwicompare"
version = "0.1.0"
description = "Shared helpers for comparing DESIGNER vs TORTOISE DWI pipeline outputs"
requires-python = ">=3.11"
# No dependency list here: environment.yml is the single source of truth for
# runtime deps -- this package is only ever installed editable into that env.

[tool.setuptools]
packages = ["dwicompare"]
